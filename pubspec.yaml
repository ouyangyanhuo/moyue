name: moyue_application
description: "A new Flutter project."
# 下一行可防止软件包被意外地通过 `flutter pub publish` 发布到 pub.dev。
# 对于私有软件包，建议这样设置。
publish_to: 'none' # 如需发布到 pub.dev，请删除此行。

# 以下内容定义应用程序的版本号和构建号。
# 版本号由点分隔的三个数字组成，例如 1.2.43，后面可以跟一个以 + 分隔的可选构建号。
# 在执行 flutter build 时，可以分别通过 --build-name 和 --build-number 覆盖版本名称和构建号。
# 在 Android 中，build-name 用作 versionName，build-number 用作 versionCode。
# Android 版本号的更多信息：https://developer.android.com/studio/publish/versioning
# 在 iOS 中，build-name 用作 CFBundleShortVersionString，build-number 用作 CFBundleVersion。
# iOS 版本号的更多信息：
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# 在 Windows 中，build-name 用作产品版本和文件版本的主版本、次版本及修订版本部分，
# build-number 用作构建后缀。
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# dependencies 用于指定软件包正常运行所需的其他软件包。
# 如需自动将依赖升级到最新版本，可以运行 `flutter pub upgrade --major-versions`。
# 也可以手动将下面的版本号改为 pub.dev 上可用的最新版本。
# 如需查看哪些依赖有更新版本可用，请运行 `flutter pub outdated`。
dependencies:
  flutter:
    sdk: flutter

  # 跟随系统明暗模式，并为后续的主题切换设置保留统一入口。
  adaptive_theme: 3.7.2
  liquid_glass_widgets: ^0.29.6

  # 以下内容将 Cupertino Icons 字体添加到应用程序中。
  # 可与 CupertinoIcons 类一起使用，以显示 iOS 风格的图标。
  cupertino_icons: ^1.0.8
  # https://github.com/flutter/flutter/blob/master/packages/flutter_localizations/README.md
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 下面的“flutter_lints”软件包包含一组推荐的 lint，用于鼓励良好的编码习惯。
  # 该软件包提供的 lint 集合会在软件包根目录的 `analysis_options.yaml` 文件中启用。
  # 关于停用特定 lint 规则和启用其他规则的信息，请参见该文件。
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2
  # https://github.com/jonbhanson/flutter_native_splash
  flutter_native_splash: ^2.4.8

# 关于此文件中通用 Dart 部分的信息，请参见以下页面：
# https://dart.dev/tools/pub/pubspec

# 以下部分专用于 Flutter 软件包。
flutter:

  # 根据 lib/l10n 中的 ARB 文件生成 AppLocalizations。
  generate: true

  # 以下内容确保应用程序包含 Material Icons 字体，
  # 这样就可以使用 material Icons 类中的图标。
  uses-material-design: true

  # 如需向应用程序添加资源，请像下面这样添加 assets 部分：
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 图像资源可以引用一个或多个特定分辨率的“变体”，请参见
  # https://flutter.dev/to/resolution-aware-images

  # 关于从软件包依赖添加资源的详细信息，请参见
  # https://flutter.dev/to/asset-from-package

  # 如需向应用程序添加自定义字体，请在此处的“flutter”部分添加 fonts 部分。
  # 列表中的每个条目都应包含一个值为字体系列名称的“family”键，以及一个
  # 用于列出字体资源和其他描述信息的“fonts”键。例如：
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 关于从软件包依赖添加字体的详细信息，请参见
  # https://flutter.dev/to/font-from-package
