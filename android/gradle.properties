# JVM 内存上限需适配 GitHub Actions 的 7GB 内存 runner，不能设得过大。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 此 newDsl 标志由 Flutter 模板添加。
android.newDsl=false
# AGP 9 使用内置 Kotlin；file_picker 等现代插件也依赖该编译路径。
android.builtInKotlin=true
# 项目位于 F 盘而 pub 缓存位于 C 盘；关闭增量缓存以避免 Kotlin 跨盘相对路径错误。
kotlin.incremental=false
# 注意：不要在仓库中配置 org.gradle.java.home 等机器相关路径，
# 否则 GitHub Actions（Linux）会因找不到 Windows 路径而构建失败。
# 本地如需指定 JDK，请写入用户级配置 ~/.gradle/gradle.properties。
