name: Build Android Release APKs

# 触发方式：
# 1. 推送 tag（如 v1.0.1、v1.0.1+3）时自动构建并发布
# 2. 在 GitHub Actions 页面手动触发，可分别指定公开版本号、数字构建号和关于页内部版本号
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '公开版本号，如 1.0.1；也兼容 1.0.1+3，留空则使用 pubspec.yaml'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Android 数字构建号（versionCode），如 3；留空则取版本号中的 +数字或 pubspec.yaml'
        required: false
        default: ''
        type: string
      internal_version:
        description: '关于页括号内的内部版本号，如 Apple（最终显示 1.0.1(Apple)）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter pub get
        run: flutter pub get

      # 解析版本号：
      # - 手动触发时优先用输入值
      # - push tag 时去掉前缀 v（v1.0.1+3 -> 1.0.1 / build 3）
      # - 其余情况读取 pubspec.yaml
      # - Android 数字构建号可用 build_number 单独覆盖
      # - 内部版本优先使用手动输入，其次使用仓库变量，最后回退到构建号
      - name: Resolve version info
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          INTERNAL_VERSION_INPUT: ${{ inputs.internal_version }}
          INTERNAL_VERSION_VARIABLE: ${{ vars.MOYUE_INTERNAL_VERSION }}
        run: |
          set -euo pipefail

          if [ -n "$VERSION_INPUT" ]; then
            RAW="$VERSION_INPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RAW="${GITHUB_REF_NAME#v}"
          else
            RAW=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          fi

          if [[ "$RAW" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            VERSION_BUILD_NUMBER="${BASH_REMATCH[2]}"
          elif [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$RAW"
            VERSION_BUILD_NUMBER=""
          else
            echo "::error::无法解析版本号: $RAW（示例：1.0.1 或 1.0.1+3）"
            exit 1
          fi

          BUILD_NUMBER_INPUT="$(printf '%s' "$BUILD_NUMBER_INPUT" | tr -d '[:space:]')"
          if [ -n "$BUILD_NUMBER_INPUT" ]; then
            BUILD_NUMBER="$BUILD_NUMBER_INPUT"
          elif [ -n "$VERSION_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$VERSION_BUILD_NUMBER"
          else
            BUILD_NUMBER=$(grep -E '^version:' pubspec.yaml | grep -oE '\+[0-9]+' | head -n1 | tr -d '+')
            [ -n "$BUILD_NUMBER" ] || BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Android 数字构建号必须是大于 0 的整数，当前值: $BUILD_NUMBER"
            exit 1
          fi

          for CANDIDATE in "$INTERNAL_VERSION_INPUT" "$INTERNAL_VERSION_VARIABLE"; do
            if [[ "$CANDIDATE" == *$'\n'* ]] || [[ "$CANDIDATE" == *$'\r'* ]]; then
              echo "::error::内部版本号不能包含换行符。"
              exit 1
            fi
          done

          trim_whitespace() {
            local VALUE="$1"
            VALUE="${VALUE#"${VALUE%%[![:space:]]*}"}"
            VALUE="${VALUE%"${VALUE##*[![:space:]]}"}"
            printf '%s' "$VALUE"
          }
          INTERNAL_VERSION_INPUT="$(trim_whitespace "$INTERNAL_VERSION_INPUT")"
          INTERNAL_VERSION_VARIABLE="$(trim_whitespace "$INTERNAL_VERSION_VARIABLE")"

          if [ -n "$INTERNAL_VERSION_INPUT" ]; then
            INTERNAL_VERSION="$INTERNAL_VERSION_INPUT"
          elif [ -n "$INTERNAL_VERSION_VARIABLE" ]; then
            INTERNAL_VERSION="$INTERNAL_VERSION_VARIABLE"
          else
            INTERNAL_VERSION="$BUILD_NUMBER"
          fi

          if [ "${#INTERNAL_VERSION}" -gt 64 ]; then
            echo "::error::内部版本号不能超过 64 个字符。"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "internal_version=$INTERNAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=${VERSION}(${INTERNAL_VERSION})" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "解析结果: version=$VERSION build=$BUILD_NUMBER internal=$INTERNAL_VERSION about=${VERSION}(${INTERNAL_VERSION}) tag=$RELEASE_TAG"

      - name: Write version summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          INTERNAL_VERSION: ${{ steps.version.outputs.internal_version }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
        run: |
          {
            echo "## 本次构建版本"
            echo ""
            printf '%s\n' "- 关于页：\`$DISPLAY_VERSION\`"
            printf '%s\n' "- 公开版本号（versionName）：\`$VERSION\`"
            printf '%s\n' "- Android 数字构建号（versionCode）：\`$BUILD_NUMBER\`"
            printf '%s\n' "- 内部版本号：\`$INTERNAL_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify About version binding
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INTERNAL_VERSION: ${{ steps.version.outputs.internal_version }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
        run: >-
          flutter test
          --dart-define=MOYUE_INTERNAL_VERSION="$INTERNAL_VERSION"
          --dart-define=MOYUE_EXPECTED_INTERNAL_VERSION="$INTERNAL_VERSION"
          --dart-define=MOYUE_EXPECTED_PUBLIC_VERSION="$VERSION"
          --dart-define=MOYUE_EXPECTED_DISPLAY_VERSION="$DISPLAY_VERSION"
          test/app_version_service_test.dart

      # 签名配置（可选）：
      # 若在仓库 Secrets 中配置了 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，
      # 则用正式签名构建；否则使用 debug 签名（仅用于测试）。
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/keystore.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "使用正式签名构建。"
          else
            echo "::warning::未配置签名 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），将使用 debug 签名构建，仅适用于测试。"
          fi

      - name: Build ABI-split APKs (armeabi-v7a, arm64-v8a, x86_64)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          INTERNAL_VERSION: ${{ steps.version.outputs.internal_version }}
        run: flutter build apk --release --split-per-abi --build-name="$VERSION" --build-number="$BUILD_NUMBER" --dart-define=MOYUE_INTERNAL_VERSION="$INTERNAL_VERSION"

      - name: Build universal (fat) APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          INTERNAL_VERSION: ${{ steps.version.outputs.internal_version }}
        run: flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" --dart-define=MOYUE_INTERNAL_VERSION="$INTERNAL_VERSION"

      - name: Collect & rename APKs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          APK_DIR="$GITHUB_WORKSPACE/build/app/outputs/flutter-apk"
          mkdir -p "$RELEASE_DIR"
          cp "$APK_DIR/app-armeabi-v7a-release.apk" "$RELEASE_DIR/moyue-application-${VERSION}-armeabi-v7a.apk"
          cp "$APK_DIR/app-arm64-v8a-release.apk" "$RELEASE_DIR/moyue-application-${VERSION}-arm64-v8a.apk"
          cp "$APK_DIR/app-x86_64-release.apk" "$RELEASE_DIR/moyue-application-${VERSION}-x86_64.apk"
          cp "$APK_DIR/app-release.apk" "$RELEASE_DIR/moyue-application-${VERSION}-universal.apk"
          cd "$RELEASE_DIR"
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          INTERNAL_VERSION: ${{ steps.version.outputs.internal_version }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          NOTES_FILE="$GITHUB_WORKSPACE/release-notes.md"
          CURRENT_SHA="$(git rev-parse --short HEAD)"
          CURRENT_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          PREVIOUS_TAG="$(git tag --sort=-creatordate --merged HEAD | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            COMPARE_RANGE="${PREVIOUS_TAG}..HEAD"
            UPDATE_SCOPE="自 ${PREVIOUS_TAG} 以来的更新"
          else
            COMPARE_RANGE="HEAD"
            UPDATE_SCOPE="本次构建包含的更新"
          fi

          {
            echo "## 版本信息"
            echo ""
            printf '%s\n' "- 公开版本号：\`${VERSION}\`"
            printf '%s\n' "- 关于页显示：\`${DISPLAY_VERSION}\`"
            printf '%s\n' "- 内部版本号：\`${INTERNAL_VERSION}\`"
            printf '%s\n' "- Android build：\`${BUILD_NUMBER}\`"
            printf '%s\n' "- 构建提交：\`${CURRENT_SHA}\`"
            printf '%s\n' "- 发布时间：\`${CURRENT_DATE}\`"
            echo ""
            echo "## 这次更新了什么"
            echo ""
            echo "${UPDATE_SCOPE}："
            echo ""
          } > "$NOTES_FILE"

          if git log --format='%s' "$COMPARE_RANGE" | grep -q .; then
            git log --no-merges --pretty=format:'- %s (%h)' "$COMPARE_RANGE" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
          else
            echo "- 本次 release 未检测到新的提交记录。" >> "$NOTES_FILE"
          fi

          {
            echo ""
            echo "## 改动文件摘要"
            echo ""
          } >> "$NOTES_FILE"

          if [ -n "$PREVIOUS_TAG" ] && git diff --name-only "$COMPARE_RANGE" | grep -q .; then
            git diff --name-only "$COMPARE_RANGE" | sed 's/^/- `/' | sed 's/$/`/' >> "$NOTES_FILE"
          elif git show --name-only --format='' HEAD | grep -q .; then
            git show --name-only --format='' HEAD | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/' >> "$NOTES_FILE"
          else
            echo "- 未检测到文件变更摘要。" >> "$NOTES_FILE"
          fi

          {
            echo ""
            echo "## 下载说明"
            echo ""
            echo "- \`armeabi-v7a\`：32 位 ARM，适合较旧 Android 设备。"
            echo "- \`arm64-v8a\`：64 位 ARM，适合大多数主流 Android 设备。"
            echo "- \`x86_64\`：适合 x86_64 模拟器或少数 x86_64 设备。"
            echo "- \`universal\`：通用包，包含全部 ABI，兼容性最好但体积最大。"
            echo ""
            echo "## 校验"
            echo ""
            echo "各 APK 的 SHA256 校验值见随附的 \`SHA256SUMS.txt\`。"
          } >> "$NOTES_FILE"

          cat "$NOTES_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_tag }}
          body_path: release-notes.md
          files: release/*
