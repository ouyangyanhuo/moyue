<!DOCTYPE html><html><head>
  <!--
    如果 Web 应用不是从根路径提供服务，请修改下面的 href 值，以反映提供服务时使用的基础路径。

    为确保正常工作，下面提供的路径必须以斜杠“/”开头和结尾。

    详细信息：
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    这里的 base href 是占位符，Flutter build 提供的 `--base-href` 参数会替换它。
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Moyue">

  <!-- iOS 元标签和图标。 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moyue">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- 网站图标。 -->
  <link id="app-favicon" rel="icon" type="image/png" href="favicon.png">

  <title>Moyue</title>
  <script>
    const isChineseLocale = /^zh(?:-|_|$)/i.test(navigator.language || "");
    const localizedAppName = isChineseLocale ? "墨阅" : "Moyue";
    const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
    document.title = localizedAppName;
    document
      .querySelector('meta[name="apple-mobile-web-app-title"]')
      ?.setAttribute("content", localizedAppName);

    const manifestLink = document.createElement("link");
    manifestLink.rel = "manifest";
    document.head.appendChild(manifestLink);

    function applySystemIcon(isDark) {
      const iconDirectory = isDark ? "icons_dark" : "icons";
      document
        .querySelector("#apple-touch-icon")
        ?.setAttribute("href", `${iconDirectory}/Icon-192.png`);
      document
        .querySelector("#app-favicon")
        ?.setAttribute("href", isDark ? "favicon_dark.png" : "favicon.png");

      const languageSuffix = isChineseLocale ? ".zh" : "";
      const themeSuffix = isDark ? ".dark" : "";
      manifestLink.href = `manifest${languageSuffix}${themeSuffix}.json`;
    }

    applySystemIcon(colorScheme.matches);
    colorScheme.addEventListener?.("change", (event) => {
      applySystemIcon(event.matches);
    });
  </script>

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FDF6E8;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #151517;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>


  <!--
    你可以自定义“flutter_bootstrap.js”脚本。
    这有助于为 Flutter 加载器提供自定义配置，或在初始化过程中向用户提供反馈。

    详细信息：
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>

</body></html>
